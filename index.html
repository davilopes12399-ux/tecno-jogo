<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECNO: A Ilha Digital</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #030814; font-family: sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; display: block; background: #081026; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; font-size: 12px; font-weight: bold; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 8px; border: 1px solid #00f0ff; }
        #controls { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 20; }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn { width: 55px; height: 55px; background: rgba(0, 240, 255, 0.2); border: 2px solid #00f0ff; border-radius: 50%; color: #fff; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(0, 240, 255, 0.7); transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div class="hud-box">HP: <span id="hp">100</span>%</div>
            <div class="hud-box">ARGOLAS: <span id="rings">0</span></div>
            <div class="hud-box">FASE: <span id="lvl">1</span>/5</div>
        </div>
        <div id="controls">
            <div class="btn-group">
                <div class="btn" id="b-left">◀</div>
                <div class="btn" id="b-right">▶</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="b-jump" style="background:rgba(0,255,100,0.3); border-color:#00ff88;">▲</div>
                <div class="btn" id="b-boost" style="background:rgba(255,0,100,0.3); border-color:#ff0055;">⚡</div>
            </div>
        </div>
    </div>
    <script>
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');
        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let state = 'START';
        let px = 80, py = cvs.height - 120, vx = 0, vy = 0;
        let hp = 100, rings = 0, level = 1;
        let keys = { l: false, r: false, j: false, b: false };

        function bind(id, k) {
            let el = document.getElementById(id);
            let on = (e) => { e.preventDefault(); keys[k] = true; if(state==='START') state='PLAY'; };
            let off = (e) => { e.preventDefault(); keys[k] = false; };
            el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
            el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
        }
        bind('b-left','l'); bind('b-right','r'); bind('b-jump','j'); bind('b-boost','b');
        window.addEventListener('click', () => { if(state==='START') state='PLAY'; });

        function loop() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            let ground = cvs.height - 60;

            if (state === 'START') {
                ctx.fillStyle = '#00f0ff';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('TECNO: A ILHA DIGITAL', cvs.width/2, cvs.height/2 - 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText('TOQUE EM QUALQUER BOTÃO PARA JOGAR', cvs.width/2, cvs.height/2 + 20);
            } else {
                // Física
                let speed = keys.b ? 7 : 4;
                if (keys.l) vx = -speed;
                else if (keys.r) vx = speed;
                else vx *= 0.8;

                if (keys.j && py >= ground - 20) { vy = -12; }
                vy += 0.6; px += vx; py += vy;

                if (py > ground - 20) { py = ground - 20; vy = 0; }
                if (px < 20) px = 20; if (px > cvs.width - 20) px = cvs.width - 20;

                // Desenhar Chão
                ctx.fillStyle = '#1c2836';
                ctx.fillRect(0, ground, cvs.width, 60);
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(0, ground, cvs.width, 4);

                // Desenhar TECNO (Robô Branco)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath(); ctx.arc(px + (vx >= 0 ? 5 : -5), py - 3, 5, 0, Math.PI*2); ctx.fill();

                document.getElementById('hp').innerText = hp;
                document.getElementById('rings').innerText = rings;
                document.getElementById('lvl').innerText = level;
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
