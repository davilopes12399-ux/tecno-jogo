<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TECNO: A Ilha Digital</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        /* HUD UI Elements */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 18px;
            z-index: 10;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .hud-card {
            background: rgba(3, 12, 30, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,240,255,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hud-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8ae4ff;
        }
        .hud-value {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 8px #00f0ff;
        }
        .bar-container {
            width: 140px;
            height: 12px;
            background: rgba(10, 20, 40, 0.8);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }
        #hp-fill { background: linear-gradient(90deg, #ff0055, #ff5500); box-shadow: 0 0 8px #ff0055; }
        #boost-fill { background: linear-gradient(90deg, #0088ff, #00f0ff); box-shadow: 0 0 8px #00f0ff; }
        #fly-fill { background: linear-gradient(90deg, #00ffaa, #00f0ff); box-shadow: 0 0 8px #00ffaa; }

        /* Controles Móveis Glassmorphism */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        .touch-group {
            position: absolute;
            pointer-events: auto;
            display: flex;
            gap: 12px;
        }
        #dpad-group {
            left: 20px;
            bottom: 20px;
        }
        #action-group {
            right: 20px;
            bottom: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
        }
        .btn-touch {
            width: 62px;
            height: 62px;
            background: rgba(10, 25, 50, 0.55);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 0 10px rgba(0,240,255,0.2);
            touch-action: manipulation;
            transition: transform 0.08s, background 0.08s, border-color 0.08s;
        }
        .btn-touch:active, .btn-touch.active {
            transform: scale(0.90);
            background: rgba(0, 240, 255, 0.4);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }
        .btn-dir {
            width: 68px;
            height: 68px;
            font-size: 24px;
        }
        .btn-action-jump { grid-column: 3; grid-row: 2; background: rgba(0, 200, 100, 0.35); border-color: rgba(0, 255, 150, 0.7); }
        .btn-action-boost { grid-column: 2; grid-row: 2; background: rgba(0, 120, 255, 0.35); border-color: rgba(0, 180, 255, 0.7); }
        .btn-action-homing { grid-column: 1; grid-row: 2; background: rgba(220, 0, 255, 0.35); border-color: rgba(240, 100, 255, 0.7); }
        .btn-action-fly { grid-column: 3; grid-row: 1; background: rgba(255, 170, 0, 0.35); border-color: rgba(255, 200, 50, 0.7); }
        .btn-action-hack { grid-column: 2; grid-row: 1; background: rgba(255, 0, 80, 0.35); border-color: rgba(255, 80, 120, 0.7); width: 62px; height: 62px; border-radius: 16px; font-size: 10px; }

        /* Overlay do Boss */
        #boss-ui {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 450px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }
        #boss-bar {
            width: 100%;
            height: 16px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff0055;
            border-radius: 8px;
            overflow: hidden;
        }
        #boss-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            box-shadow: 0 0 12px #ff0055;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay">
            <div class="hud-top">
                <div class="hud-card">
                    <div>
                        <div class="hud-label">SISTEMA HP</div>
                        <div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div>
                    </div>
                </div>
                <div class="hud-card">
                    <div>
                        <div class="hud-label">BOOST</div>
                        <div class="bar-container"><div id="boost-fill" class="bar-fill"></div></div>
                    </div>
                    <div>
                        <div class="hud-label">VOO</div>
                        <div class="bar-container"><div id="fly-fill" class="bar-fill"></div></div>
                    </div>
                </div>
                <div class="hud-card">
                    <div>
                        <div class="hud-label">ARGOLAS</div>
                        <div id="rings-val" class="hud-value">000</div>
                    </div>
                    <div>
                        <div class="hud-label">HACKING</div>
                        <div id="hack-val" class="hud-value">0/0</div>
                    </div>
                </div>
            </div>

            <div id="boss-ui">
                <div class="hud-label" style="color: #ff0055; font-size: 14px;">TITÃ DA SUCATA - CHEFE FINAL</div>
                <div id="boss-bar"><div id="boss-fill"></div></div>
            </div>
        </div>

        <div id="touch-controls">
            <div id="dpad-group" class="touch-group">
                <div id="btn-left" class="btn-touch btn-dir">◀</div>
                <div id="btn-right" class="btn-touch btn-dir">▶</div>
            </div>
            <div id="action-group" class="touch-group">
                <div id="btn-hack" class="btn-touch btn-action-hack">HACK</div>
                <div id="btn-fly" class="btn-touch btn-action-fly">VOO</div>
                <div id="btn-homing" class="btn-touch btn-action-homing">HOMING</div>
                <div id="btn-boost" class="btn-touch btn-action-boost">BOOST</div>
                <div id="btn-jump" class="btn-touch btn-action-jump">PULO</div>
            </div>
        </div>
    </div>

    <script>
        /* SINTETIZADOR DE ÁUDIO WEB AUDIO API */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            jump() { this.playTone(350, 'sine', 0.15, 0.15); }
            ring() { this.playTone(987, 'sine', 0.08, 0.12); setTimeout(()=>this.playTone(1318, 'sine', 0.15, 0.12), 60); }
            boost() { this.playTone(150, 'sawtooth', 0.3, 0.2); }
            homing() { this.playTone(600, 'square', 0.12, 0.15); }
            hackStep() { this.playTone(800, 'triangle', 0.05, 0.05); }
            hackDone() { this.playTone(523, 'sine', 0.1, 0.15); setTimeout(()=>this.playTone(659, 'sine', 0.1, 0.15), 100); setTimeout(()=>this.playTone(783, 'sine', 0.2, 0.15), 200); }
            hit() { this.playTone(100, 'sawtooth', 0.25, 0.25); }
            explode() { this.playTone(80, 'square', 0.4, 0.3); }
        }
        const audio = new SoundEngine();

        /* MOTOR DO JOGO E CANVAS */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = 960;
            canvas.height = 540;
        }
        resizeCanvas();

        const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (isMobile) {
            document.getElementById('touch-controls').style.display = 'block';
        }

        /* CONTROLES E INPUTS */
        const keys = { left: false, right: false, up: false, down: false, jump: false, boost: false, homing: false, fly: false, hack: false };

        window.addEventListener('keydown', e => {
            audio.init();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space') keys.jump = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = true;
            if (e.code === 'KeyX') keys.homing = true;
            if (e.code === 'KeyC') keys.fly = true;
            if (e.code === 'KeyE') keys.hack = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space') keys.jump = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.boost = false;
            if (e.code === 'KeyX') keys.homing = false;
            if (e.code === 'KeyC') keys.fly = false;
            if (e.code === 'KeyE') keys.hack = false;
        });

        function bindTouch(id, keyName) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); audio.init(); keys[keyName] = true; btn.classList.add('active'); };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
            btn.addEventListener('touchstart', start, {passive: false});
            btn.addEventListener('touchend', end, {passive: false});
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump');
        bindTouch('btn-boost', 'boost');
        bindTouch('btn-homing', 'homing');
        bindTouch('btn-fly', 'fly');
        bindTouch('btn-hack', 'hack');

        /* ESTADO GLOBAL DO JOGO */
        let gameState = 'START'; // START, PLAYING, LEVEL_CLEAR, GAME_OVER, CUTSCENE
        let currentLevelIndex = 0;
        let score = 0;
        let ringsCollectedTotal = 0;
        let cameraX = 0;
        let particles = [];
        let cutsceneStep = 0;
        let cutsceneTimer = 0;

        /* DADOS DAS FASES */
        const LEVELS = [
            { name: '1. O Paraíso Corrompido', color: '#1a3c40', pollution: 0.25, width: 3200, isAir: false },
            { name: '2. Fábrica Química', color: '#2b1055', pollution: 0.50, width: 3500, isAir: false },
            { name: '3. Metrópolis', color: '#121212', pollution: 0.75, width: 4000, isAir: false },
            { name: '4. Sinta o Vento', color: '#0d2040', pollution: 0.60, width: 4500, isAir: true },
            { name: '5. O Núcleo da Poluição', color: '#3a0007', pollution: 0.95, width: 2800, isAir: false }
        ];

        /* CLASSE PROTAGONISTA TECNO (REDESENHADO ESTILO EVA) */
        class Tecno {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = 100;
                this.y = 300;
                this.vx = 0;
                this.vy = 0;
                this.radius = 18;
                this.hp = 100;
                this.maxHp = 100;
                this.boostEnergy = 100;
                this.flyEnergy = 100;
                this.isGrounded = false;
                this.facingRight = true;
                this.isBoosting = false;
                this.isFlying = false;
                this.isSpinning = false;
                this.invulnerable = 0;
                this.trail = [];
                this.rings = 0;
            }
            update(level) {
                if (this.invulnerable > 0) this.invulnerable--;

                // Recarga de Energias
                if (!this.isBoosting && this.boostEnergy < 100) this.boostEnergy += 0.4;
                if (!this.isFlying && this.flyEnergy < 100) this.flyEnergy += 0.3;

                // FASE AÉREA (4. Sinta o Vento)
                if (level.isAir) {
                    const speed = keys.boost && this.boostEnergy > 5 ? 8 : 5;
                    if (keys.boost) this.boostEnergy -= 0.8;
                    this.vx = 0; this.vy = 0;
                    if (keys.left) { this.vx = -speed; this.facingRight = false; }
                    if (keys.right) { this.vx = speed; this.facingRight = true; }
                    if (keys.up || keys.jump) this.vy = -speed;
                    if (keys.down) this.vy = speed;
                    this.x += this.vx; this.y += this.vy;
                    this.y = Math.max(40, Math.min(canvas.height - 60, this.y));
                    this.x = Math.max(30, Math.min(level.width - 50, this.x));

                    // Rastro
                    if (Math.random() < 0.6) {
                        particles.push(new Particle(this.x - (this.facingRight?15:-15), this.y, '#00f0ff', -this.vx*0.5, (Math.random()-0.5)*2, 10, 3));
                    }
                    return;
                }

                // FASES NORMAIS (PLATAFORMA)
                this.isBoosting = keys.boost && this.boostEnergy > 10;
                const maxSpeed = this.isBoosting ? 10 : 5.5;
                const accel = this.isBoosting ? 0.8 : 0.4;

                if (this.isBoosting) {
                    this.boostEnergy -= 1.2;
                    audio.boost();
                }

                if (keys.left) {
                    this.vx = Math.max(-maxSpeed, this.vx - accel);
                    this.facingRight = false;
                } else if (keys.right) {
                    this.vx = Math.min(maxSpeed, this.vx + accel);
                    this.facingRight = true;
                } else {
                    this.vx *= 0.85;
                }

                // Pulo
                if (keys.jump && this.isGrounded) {
                    this.vy = -12;
                    this.isGrounded = false;
                    this.isSpinning = true;
                    audio.jump();
                }

                // Habilidades - Fly/Glide
                if (keys.fly && !this.isGrounded && this.flyEnergy > 5) {
                    this.isFlying = true;
                    this.vy = Math.min(this.vy, 1);
                    this.flyEnergy -= 0.8;
                    particles.push(new Particle(this.x, this.y + 12, '#00ffaa', (Math.random()-0.5)*2, 2, 8, 3));
                } else {
                    this.isFlying = false;
                }

                // Habilidades - Homing Attack
                if (keys.homing && !this.isGrounded && !this.homingUsed) {
                    this.homingUsed = true;
                    let target = null;
                    let minDist = 220;
                    enemies.forEach(e => {
                        let d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) { minDist = d; target = e; }
                    });
                    if (target) {
                        let angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.vx = Math.cos(angle) * 16;
                        this.vy = Math.sin(angle) * 16;
                    } else {
                        this.vx = this.facingRight ? 14 : -14;
                        this.vy = -2;
                    }
                    audio.homing();
                }

                // Gravidade
                this.vy += 0.55;
                this.x += this.vx;
                this.y += this.vy;

                if (this.isGrounded) {
                    this.homingUsed = false;
                    this.isSpinning = false;
                }

                // Limites
                this.x = Math.max(20, Math.min(level.width - 20, this.x));

                // Rastro
                this.trail.push({x: this.x, y: this.y, alpha: 0.6});
                if (this.trail.length > (this.isBo
