<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECNO: A Ilha Digital</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #030814; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; display: block; background: #030814; }
        
        #ui { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
        .hud-box { background: rgba(5, 11, 24, 0.85); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.5); box-shadow: 0 0 12px rgba(0, 240, 255, 0.3); pointer-events: auto; }
        .hud-val { color: #00f0ff; font-size: 14px; text-shadow: 0 0 8px rgba(0,240,255,0.6); }

        #controls { position: absolute; bottom: 16px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 18px; pointer-events: none; z-index: 20; }
        .btn-group { display: flex; gap: 14px; pointer-events: auto; }
        .btn { width: 78px; height: 78px; background: rgba(0, 240, 255, 0.2); border: 3px solid #00f0ff; border-radius: 50%; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; backdrop-filter: blur(8px); box-shadow: 0 0 18px rgba(0, 240, 255, 0.4); }
        .btn:active { background: rgba(0, 240, 255, 0.7); transform: scale(0.90); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div class="hud-box">HP: <span id="hp" class="hud-val">100</span>%</div>
            <div class="hud-box">BOOST: <span id="boost" class="hud-val">100</span>%</div>
            <div class="hud-box">ARGOLAS: <span id="rings" class="hud-val">0</span></div>
            <div class="hud-box">FASE: <span id="lvl" class="hud-val">1</span>/5</div>
            <div class="hud-box" id="mute-btn" style="cursor:pointer;">SOM: <span id="mute-status" class="hud-val">ON</span></div>
        </div>

        <div id="controls">
            <div class="btn-group">
                <div class="btn" id="b-left">◀</div>
                <div class="btn" id="b-right">▶</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="b-jump" style="background:rgba(0,255,136,0.25); border-color:#00ff88; box-shadow:0 0 18px rgba(0,255,136,0.4);">▲</div>
                <div class="btn" id="b-boost" style="background:rgba(255,0,85,0.25); border-color:#ff0055; box-shadow:0 0 18px rgba(255,0,85,0.4);">⚡</div>
                <div class="btn" id="b-homing" style="background:rgba(255,204,0,0.25); border-color:#ffcc00; box-shadow:0 0 18px rgba(255,204,0,0.4);">🎯</div>
                <div class="btn" id="b-fly" style="background:rgba(187,0,255,0.25); border-color:#bb00ff; box-shadow:0 0 18px rgba(187,0,255,0.4);">🛸</div>
            </div>
        </div>
    </div>

    <script>
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');

        function resize() {
            cvs.width = window.innerWidth;
            cvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Engine de Áudio Chiptune Dinâmico por Fase
        class ChiptuneAudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.isPlaying = false;
                this.currentLevel = 1;
                this.step = 0;
                this.timer = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSFX(freq, type = 'sine', duration = 0.1, vol = 0.1) {
                if (!this.ctx || this.isMuted) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            startMusic(level) {
                this.init();
                this.currentLevel = level;
                if (this.isPlaying) this.stopMusic();
                this.isPlaying = true;
                this.step = 0;
                this.scheduler();
            }

            stopMusic() {
                this.isPlaying = false;
                if (this.timer) clearTimeout(this.timer);
            }

            scheduler() {
                if (!this.isPlaying || this.isMuted) return;

                const scales = {
                    1: [261.63, 293.66, 329.63, 392.00, 440.00], // Do Maior (Alegre)
                    2: [220.00, 246.94, 261.63, 293.66, 329.63], // Lá Menor (Neon Ruins)
                    3: [164.81, 196.00, 220.00, 246.94, 293.66], // Mi Menor (Tech Forest)
                    4: [138.59, 146.83, 164.81, 185.00, 207.65], // Vulcânico Tenso
                    5: [293.66, 329.63, 349.23, 392.00, 440.00]  // Cidadela Épica
                };

                let currentScale = scales[this.currentLevel] || scales[1];
                let note = currentScale[this.step % currentScale.length];
                let bassNote = note / 2;

                if (this.step % 2 === 0) {
                    this.playNote(note, 'square', 0.12, 0.04);
                }
                if (this.step % 4 === 0) {
                    this.playNote(bassNote, 'sawtooth', 0.2, 0.06);
                }

                this.step++;
                let bpm = 130 + (this.currentLevel * 10);
                let speedMs = (60 / bpm / 2) * 1000;
                this.timer = setTimeout(() => this.scheduler(), speedMs);
            }

            playNote(freq, type, duration, vol) {
                if (!this.ctx || this.isMuted) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
        }

        const audio = new ChiptuneAudioEngine();

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.isMuted = !audio.isMuted;
            document.getElementById('mute-status').innerText = audio.isMuted ? 'OFF' : 'ON';
            if (!audio.isMuted) audio.startMusic(level);
        });

        // Estado Global do Jogo
        let gameState = 'START';
        let level = 1;
        let hp = 100, boost = 100, rings = 0;
        let px = 100, py = 0, vx = 0, vy = 0;
        let isHovering = false, isHoming = false, homingTarget = null;
        let activeCheckpoint = { x: 100, y: 0 };

        let keys = { left: false, right: false, jump: false, boost: false, homing: false, fly: false };

        let platforms = [];
        let collectibles = [];
        let particles = [];
        let enemies = [];
        let checkpoints = [];

        const LEVEL_WIDTH = 12000;

        function initLevel(lvl) {
            level = lvl;
            platforms = [];
            collectibles = [];
            particles = [];
            enemies = [];
            checkpoints = [];

            let groundY = cvs.height - 80;
            platforms.push({ x: 0, y: groundY, w: LEVEL_WIDTH, h: 80, type: 'ground' });

            // Checkpoints
            checkpoints.push({ x: 200, y: groundY - 60, active: true });
            checkpoints.push({ x: 4000, y: groundY - 180, active: false });
            checkpoints.push({ x: 8000, y: groundY - 220, active: false });

            activeCheckpoint = { x: 200, y: groundY - 50 };
            px = activeCheckpoint.x;
            py = activeCheckpoint.y;

            // Gerador de Fases Dinâmico
            for (let i = 0; i < 50 + lvl * 10; i++) {
                let platX = 400 + i * 220 + Math.random() * 80;
                let platY = groundY - 100 - Math.random() * (cvs.height * 0.5);
                let platW = 140 + Math.random() * 120;
                platforms.push({ x: platX, y: platY, w: platW, h: 20, type: 'normal' });

                if (Math.random() > 0.2) {
                    collectibles.push({ x: platX + platW/2, y: platY - 30, r: 10, collected: false });
                }

                if (Math.random() > 0.4) {
                    let enemyType = ['motobug', 'buzzbomber', 'crabmeat'][Math.floor(Math.random() * 3)];
                    enemies.push({
                        type: enemyType,
                        x: platX + 40,
                        y: enemyType === 'buzzbomber' ? platY - 80 : platY - 24,
                        vx: (Math.random() > 0.5 ? 1 : -1) * (2 + lvl * 0.4),
                        minX: platX,
                        maxX: platX + platW - 40,
                        hp: 1
                    });
                }
            }

            audio.startMusic(level);
        }

        function setupButton(id, keyName, onPressAction) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const startHandler = (e) => {
                e.preventDefault();
                audio.init();
                if (gameState === 'START') { gameState = 'PLAY'; initLevel(level); }
                keys[keyName] = true;
                if (onPressAction) onPressAction();
            };
            const endHandler = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };
            btn.addEventListener('touchstart', startHandler, {passive: false});
            btn.addEventListener('touchend', endHandler, {passive: false});
            btn.addEventListener('mousedown', startHandler);
            btn.addEventListener('mouseup', endHandler);
        }

        setupButton('b-left', 'left');
        setupButton('b-right', 'right');
        setupButton('b-jump', 'jump');
        setupButton('b-boost', 'boost');
        setupButton('b-homing', 'homing', () => triggerHomingAttack());
        setupButton('b-fly', 'fly', () => toggleHoverFly());

        function triggerHomingAttack() {
            if (isHoming) {
                isHoming = false;
                homingTarget = null;
                audio.playSFX(300, 'square', 0.1);
                return;
            }

            let nearest = null;
            let minDist = 400;
            enemies.forEach(e => {
                let d = Math.hypot(e.x - px, e.y - py);
                if (d < minDist) {
                    minDist = d;
                    nearest = e;
                }
            });

            if (nearest) {
                isHoming = true;
                homingTarget = nearest;
                audio.playSFX(750, 'sawtooth', 0.15);
                createParticles(px, py, '#ffcc00', 10);
            }
        }

        function toggleHoverFly() {
            if (boost > 5) {
                isHovering = !isHovering;
                audio.playSFX(600, 'sine', 0.1);
            }
        }

        const startGame = () => {
            audio.init();
            if (gameState === 'START') { gameState = 'PLAY'; initLevel(level); }
        };
        window.addEventListener('touchstart', startGame);
        window.addEventListener('click', startGame);

        window.addEventListener('keydown', (e) => {
            audio.init();
            if (gameState === 'START') { gameState = 'PLAY'; initLevel(level); }
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
            if (e.key === 'Shift') keys.boost = true;
            if (e.key === 'e' || e.key === 'E') triggerHomingAttack();
            if (e.key === 'f' || e.key === 'F') toggleHoverFly();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
            if (e.key === 'Shift') keys.boost = false;
        });

        function createParticles(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color
                });
            }
        }

        function respawnAtCheckpoint() {
            hp = 100;
            boost = 100;
            px = activeCheckpoint.x;
            py = activeCheckpoint.y;
            vx = 0;
            vy = 0;
            isHoming = false;
            isHovering = false;
            createParticles(px, py, '#00f0ff', 15);
            audio.playSFX(200, 'sawtooth', 0.3);
        }

        function loop() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            if (gameState === 'START') {
                ctx.fillStyle = '#030814';
                ctx.fillRect(0, 0, cvs.width, cvs.height);

                ctx.fillStyle = '#00f0ff';
                ctx.font = '900 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 20;
                ctx.fillText('TECNO: A ILHA DIGITAL', cvs.width / 2, cvs.height / 2 - 40);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('TOQUE EM QUALQUER BOTAO PARA INICIAR', cvs.width / 2, cvs.height / 2 + 20);

            } else if (gameState === 'PLAY') {
                // Movimento 2x mais rápido
                let speedMultiplier = keys.boost && boost > 0 ? 17.0 : 9.6;

                if (keys.boost && boost > 0) {
                    boost = Math.max(0, boost - 0.5);
                    createParticles(px, py + 12, '#ff0055', 2);
                } else if (boost < 100) {
                    boost = Math.min(100, boost + 0.3);
                }

                // Lógica de Voo / Planar
                if (isHovering) {
                    if (boost > 0) {
                        vy = -1.5;
                        boost = Math.max(0, boost - 0.4);
                        createParticles(px, py + 16, '#bb00ff', 2);
                    } else {
                        isHovering = false;
                    }
                }

                // Lógica do Homing Attack (2x mais rápido)
                if (isHoming && homingTarget) {
                    let angle = Math.atan2(homingTarget.y - py, homingTarget.x - px);
                    vx = Math.cos(angle) * 32.0;
                    vy = Math.sin(angle) * 32.0;

                    createParticles(px, py, '#ffcc00', 2);

                    let dist = Math.hypot(homingTarget.x - px, homingTarget.y - py);
                    if (dist < 30) {
                        let idx = enemies.indexOf(homingTarget);
                        if (idx > -1) {
                            enemies.splice(idx, 1);
                            createParticles(px, py, '#ff0055', 12);
                            audio.playSFX(800, 'square', 0.15);
                            rings += 5;
                        }
                        isHoming = false;
                        homingTarget = null;
                        vy = -12;
                    }
                } else {
                    if (keys.left) vx = -speedMultiplier;
                    else if (keys.right) vx = speedMultiplier;
                    else vx *= 0.8;
                }

                let onGround = false;
                platforms.forEach(p => {
                    if (px + 20 > p.x && px - 20 < p.x + p.w && py + 22 >= p.y && py + 22 <= p.y + 16 && vy >= 0) {
                        py = p.y - 22;
                        vy = 0;
                        onGround = true;
                        isHovering = false;
                    }
                });

                if (keys.jump && onGround) {
                    vy = -15;
                    audio.playSFX(480, 'square', 0.12);
                    createParticles(px, py + 20, '#00ff88', 8);
                }

                if (!isHovering && !isHoming) {
                    vy += 0.75;
                }

                px += vx;
                py += vy;

                if (px < 20) px = 20;

                // Queda de Abismo
                if (py > cvs.height + 200) {
                    respawnAtCheckpoint();
                }

                // Checkpoints
                checkpoints.forEach(cp => {
                    let dist = Math.hypot(px - cp.x, py - cp.y);
                    if (dist < 40 && !cp.active) {
                        cp.active = true;
                        activeCheckpoint = { x: cp.x, y: cp.y };
                        audio.playSFX(900, 'sine', 0.25);
                        createParticles(cp.x, cp.y, '#00f0ff', 15);
                    }
                });

                let cameraX = px - cvs.width * 0.3;

                // Desenhar Checkpoints
                checkpoints.forEach(cp => {
                    let rx = cp.x - cameraX;
                    if (rx > -50 && rx < cvs.width + 50) {
                        ctx.fillStyle = cp.active ? '#00f0ff' : '#ffcc00';
                        ctx.shadowColor = cp.active ? '#00f0ff' : '#ffcc00';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(rx - 6, cp.y - 40, 12, 40);
                        ctx.beginPath();
                        ctx.arc(rx, cp.y - 45, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                });

                // Desenhar Plataformas
                platforms.forEach(p => {
                    let rx = p.x - cameraX;
                    if (rx + p.w > 0 && rx < cvs.width) {
                        ctx.fillStyle = p.type === 'ground' ? '#081326' : '#112240';
                        ctx.fillRect(rx, p.y, p.w, p.h);
                        ctx.strokeStyle = '#00f0ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRe
